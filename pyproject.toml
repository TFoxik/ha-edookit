[project]
name = "ha-edookit"
version = "0.12.0"
description = "Home Assistant integration for the Edookit parent portal"
requires-python = ">=3.14"
dependencies = ["pyedookit==0.7.0"]

[project.optional-dependencies]
test = [
    # Pins pytest, pytest-asyncio and homeassistant itself.
    "pytest-homeassistant-custom-component==0.13.372",
    # The card needs the frontend integration, whose requirement HA doesn't
    # install in tests. Keep it equal to that HA version's frontend manifest pin.
    "home-assistant-frontend==20260930.2",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
