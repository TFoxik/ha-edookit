name: Validate with HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository == 'TFoxik/ha-edookit'
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@22.5.0
        with:
          category: integration
