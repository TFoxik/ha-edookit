name: Validate with hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository == 'TFoxik/ha-edookit'
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
