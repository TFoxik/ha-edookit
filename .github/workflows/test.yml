name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Requires pyedookit to be published to PyPI first (see pyedookit's
      # own README) - this step fails until then.
      - run: pip install -e ".[test]"
      - run: pytest
      - run: ruff check .
      - run: mypy custom_components
