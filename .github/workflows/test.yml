name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      # Dependencies only: an editable install of this repo adds a path hook
      # that HA's custom-integration loader trips over.
      - run: uv pip install --system -r pyproject.toml --extra test
      - run: pytest
      - run: ruff check .
      - run: mypy custom_components
