rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud service, nothing to discover.
  discovery:
    status: exempt
    comment: Cloud service, nothing to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: Service integration, no physical devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One service device per config entry.
  entity-category:
    status: exempt
    comment: All entities are primary timetable data, none are config or diagnostic.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Every entity is part of the core timetable use case.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: >-
      The only stored settings are the school and account, which are the
      entry's identity, and the password is never stored; use reauth instead.
  repair-issues:
    status: exempt
    comment: Nothing needs user repair beyond the reauth flow.
  stale-devices:
    status: exempt
    comment: One service device per config entry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
